services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    volumes:
      - ./game_site:/app/game_site
      - static_volume:/app/game_site/staticfiles
    expose:
      - 8000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - board_game_site_app-network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - PROD_IP=${PROD_IP}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432


  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/game_site/staticfiles
    ports:
      - "8000:80"
    depends_on:
      - web
    networks:
      - board_game_site_app-network

  redis:
    image: redis:latest
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    networks:
      - board_game_site_app-network

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - board_game_site_app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cron
    volumes:
      - ./game_site:/app/game_site
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    networks:
      - board_game_site_app-network
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
    command: ["supercronic", "/app/cron_schedule"]

volumes:
  static_volume:
  postgres_data:

networks:
  board_game_site_app-network:
    driver: bridge
