{% load static %}
{% load aiedit_vite_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="{% static 'home/images/favicon.ico' %}">
  <title>{% block title %} {% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'aiedit/css/aiedit.css' %}">
  <link rel="stylesheet" href="/static/{% aiedit_vite_asset 'src/main.tsx' 'css' %}">
</head>

<body>
  <nav class="aiedit-nav">
    <a class="nav-home" href="/">← Table Top Board Games</a>
    <div class="nav-links">
      <a href="/aiedit/edit/" {% block nav_edit %}{% endblock %}>Edit Image</a>
      <a href="/aiedit/video/" {% block nav_video %}{% endblock %}>Edit Video</a>
      <a href="/aiedit/about/" {% block nav_about %}{% endblock %}>About</a>
    </div>
  </nav>
  <div class="aiedit-body">
    <div id="root"></div>
  </div>
  <script>window.aieditPage = "{% block page_name %}{% endblock %}";</script>
  <script>
    ;(function () {
      var nav = document.querySelector('.aiedit-nav')
      var lastY = 0
      window.addEventListener('scroll', function () {
        if (window.innerWidth > 600) return
        var y = window.scrollY
        nav.classList.toggle('nav-hidden', y > lastY && y > 60)
        lastY = y
      }, { passive: true })
    })()
  </script>
  <script type="module" src="/static/{% aiedit_vite_asset 'src/main.tsx' 'js' %}"></script>
</body>

</html>
