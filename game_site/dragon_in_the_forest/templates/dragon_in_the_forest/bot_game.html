{% load static %}
{% load ditf_vite_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=0.65, maximum-scale=0.65, user-scalable=no" />
  <title>Dragon in the Forest - {{ page_title }}</title>

  <!-- React build CSS -->
  <link rel="stylesheet" href="/static/{% vite_asset 'src/main.tsx' 'css' %}">
</head>

<body>
  <div id="root"></div>
  <div id="zoom-root"></div>

  <!-- Tells App.tsx to render the client-side bot board ("vs_computer" or "analysis") instead
       of the live-game (WebSocket) board -- see src/App.tsx. -->
  <script>
    window.gameData = {
      mode: "{{ mode }}",
    };
  </script>

  <!-- React build JS -->
  <script type="module" src="/static/{% vite_asset 'src/main.tsx' 'js' %}"></script>
</body>

</html>
