{% load static %}
<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <meta charset="UTF-8">
    <title>Dragon in the Forest - Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/lobby.css' %}">
    <link rel="stylesheet" href="{% static 'dragon_in_the_forest/css/lobby.css' %}">
</head>

<body>
    <div class="container">
        <p class="lobby-eyebrow">Trick-taking</p>
        <h1>Dragon in the Forest</h1>
        <div class="lobby-divider"></div>

        <div id="lobby-id" data-lobby-id="{{ lobby.id }}"
            data-lobby-status-url="{% url 'dragon-in-the-forest:lobby_status' lobby.id %}">
        </div>
        <div id="current-player" style="display: none;">{{ request.user.username }}</div>

        <div id="player-count" class="player-count"></div>

        <div id="players"></div>

        <div id="waiting-message" class="waiting-message" style="display: none;">
            ⏳ Waiting for another player...
        </div>

        <div id="ready-button"></div>
        <div id="ready-form-container" data-ready-url="{% url 'dragon-in-the-forest:lobby' %}"></div>
        <div id="game-url" data-ready-url="{% url 'dragon-in-the-forest:game_board' 0 %}"></div>

        <div class="back-link">
            <a href="{% url 'home:home' %}" class="game-button">← Back to Home</a>
        </div>
    </div>

    <script src="{% static 'dragon_in_the_forest/js/lobby.js' %}"></script>
</body>

</html>
