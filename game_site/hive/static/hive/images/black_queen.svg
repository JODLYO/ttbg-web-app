  <!-- Abdomen with stripes (yellow with white stripes) -->
  <ellipse cx="100" cy="130" rx="20" ry="35" fill="#FFC107"/>
  <ellipse cx="100" cy="115" rx="19" ry="8" fill="#ffffff"/>
  <ellipse cx="100" cy="130" rx="19" ry="8" fill="#ffffff"/>
  <ellipse cx="100" cy="145" rx="19" ry="8" fill="#ffffff"/>
  
  <!-- Wings -->
