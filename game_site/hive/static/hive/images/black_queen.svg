  <path d="M 85 100 Q 65 105 55 110" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M 115 100 Q 135 105 145 110" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  
  <path d="M 88 108 Q 68 115 58 122" stroke="#ffffff" stroke-width="2.5" fill="none"/>
