<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <!-- Head -->
  <ellipse cx="100" cy="70" rx="15" ry="12" fill="#a8d5a3" stroke="#8bc285" stroke-width="1"/>
  
  <!-- Thorax -->
  <ellipse cx="100" cy="95" rx="18" ry="15" fill="#a8d5a3" stroke="#8bc285" stroke-width="1"/>
  
  <!-- Abdomen (long) -->
  <ellipse cx="100" cy="135" rx="20" ry="45" fill="#a8d5a3" stroke="#8bc285" stroke-width="1"/>
  
  <!-- Wings -->
  <ellipse cx="95" cy="115" rx="12" ry="35" fill="#c8e6c4" stroke="#a8d5a3" stroke-width="1" opacity="0.8"/>
  <ellipse cx="105" cy="115" rx="12" ry="35" fill="#c8e6c4" stroke="#a8d5a3" stroke-width="1" opacity="0.8"/>
  
  <!-- Antennae -->
  <path d="M 92 65 Q 80 50 75 40" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M 108 65 Q 120 50 125 40" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Front legs (small) -->
  <path d="M 85 85 Q 65 85 55 90" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M 115 85 Q 135 85 145 90" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  
  <!-- Middle legs -->
  <path d="M 82 100 Q 60 105 50 115" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M 118 100 Q 140 105 150 115" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  
  <!-- Back jumping legs (large, bent) -->
  <path d="M 85 125 Q 50 130 40 145 Q 45 160 55 165" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M 115 125 Q 150 130 160 145 Q 155 160 145 165" stroke="#ffffff" stroke-width="3" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="95" cy="68" r="3" fill="#2c2c2c"/>
  <circle cx="105" cy="68" r="3" fill="#2c2c2c"/>
</svg>