services:
  web:
    image: ${DOCR_REGISTRY}/${IMAGE_NAME}:latest
    container_name: web
    volumes:
      - static_volume:/app/game_site/staticfiles
    expose:
      - 8000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    networks:
      - board_game_site_app-network
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/game_site/staticfiles
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks:
      - board_game_site_app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    entrypoint: echo "certbot container placeholder"

  redis:
    image: redis:latest
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    networks:
      - board_game_site_app-network

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - board_game_site_app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cron:
    image: ${DOCR_REGISTRY}/${IMAGE_NAME}:latest
    container_name: cron
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      web:
        condition: service_started
      postgres:
        condition: service_healthy

    networks:
      - board_game_site_app-network
    env_file:
      - .env
    command: ["supercronic", "/app/cron_schedule"]

volumes:
  static_volume:
  postgres_data:
  certbot_www:
  certbot_etc:

networks:
  board_game_site_app-network:
    driver: bridge